description = 'MC Gui API'

repositories {
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
    maven { url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/') }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.121-stable'
    compileOnly 'net.kyori:adventure-api:4.26.1'
    compileOnly 'net.kyori:adventure-platform-bukkit:4.4.1'
    compileOnly 'io.github.miniplaceholders:miniplaceholders-api:3.2.0'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'com.saicone:rtag-item:1.5.17'
    compileOnly 'com.github.cryptomorin:XSeries:13.7.1'

    compileOnly 'org.jetbrains:annotations:26.1.0'

    compileOnly fileTree(dir: 'libs', includes: ['*.jar'])
}

javadoc {
    options {
        // paper
        links 'https://jd.papermc.io/paper/26.2/'
        // adventure
        links 'https://jd.advntr.dev/api/4.26.1/'
        links 'https://jd.advntr.dev/text-minimessage/4.26.1/'
    }
}